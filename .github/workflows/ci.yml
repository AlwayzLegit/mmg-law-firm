name: Types and tests

# Every pull request to main runs the route types, the TypeScript check and the
# unit tests. Before this file, only `next build` inside the Lighthouse job
# checked types (5 to 9 minutes in, under another name) and nothing ran the
# 91 test files. See OPS-45.
#
# "Route types" comes first on purpose: on a fresh checkout `pnpm typecheck`
# fails with "Cannot find name 'PageProps'" until `next typegen` has written the
# files Next generates (next-env.d.ts and .next/types, both git-ignored).
#
# No secret and no env in this file: a pull request run holds no key.
# Cost if the repo is private: about 2 billed minutes per push to a pull
# request. To silence it: GitHub, Actions, Types and tests, Disable workflow.
# Making it a required check is a branch rule, which is the owner's.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Route types
        run: pnpm exec next typegen

      - name: Types
        run: pnpm typecheck

      - name: Tests
        run: pnpm test

  # OPS-362 (part 1 of OPS-353): the D1 data layer against a real D1 engine.
  # The "Tests" step above already runs the client and schema tests in Node's
  # built-in SQLite. This job applies migrations/d1 to wrangler's local D1
  # (workerd, on the runner, no Cloudflare account) and runs the seven-step
  # smoke test (src/lib/db/d1Smoke.test.ts), which prints "d1 smoke: N of 7"
  # (steps 6 and 7, OPS-364: bump_rate_limit and claim_content_topics).
  # No secret and no env: the database is a throwaway file in .wrangler.
  d1:
    name: D1 data layer
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Schema map is current
        run: node scripts/cloudflare/gen-d1-schema-map.mjs --check

      - name: Apply the D1 schema to a local D1
        env:
          WRANGLER_SEND_METRICS: "false"
        run: pnpm exec wrangler d1 execute DB --local --persist-to .wrangler/state --config cloudflare/wrangler.d1-ci.jsonc --file migrations/d1/0001_schema.sql

      - name: D1 smoke
        env:
          D1_SMOKE: "1"
        run: pnpm exec vitest run src/lib/db
