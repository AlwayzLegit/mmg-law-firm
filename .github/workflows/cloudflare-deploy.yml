name: Cloudflare deploy

# Builds the site with OpenNext and uploads it to a Cloudflare Worker.
# The work of one target is in cloudflare-deploy-target.yml (OPS-58); this
# file decides which targets run and in what order:
#
#   push to main  → staging (deploy, then `check`: the health probe reads the
#                   live staging site) → production (deploy, then `check`).
#                   Production starts only when staging's check is green.
#   by hand       → target staging: staging only. target production: the way
#                   back, production alone, not gated. target rehearse-gate:
#                   staging with a check that must fail, then production,
#                   which must end up skipped (a test of the gate itself; the
#                   guard refuses a rehearsal that reaches production).
#                   target front-staging / front-production (OPS-398): only
#                   the front Worker is deployed, with the build id read from
#                   the live site, for when the app cannot be built (the
#                   database is down). front-production runs only on main.
#
# The public hostnames are routes of the front Worker (wrangler.front.jsonc;
# production: www + apex, staging: staging.). It serves stored pages and
# calls the app Worker (wrangler.jsonc, workers.dev only) for everything
# else. In CI wrangler re-points a host that another Worker holds.
#
#   target=staging     → Worker `mmg-law-firm-staging` (wrangler --env staging)
#                        behind `mmg-law-firm-front-staging` on
#                        staging.mmg-lawfirm.com. No cron triggers, no
#                        analytics keys. Shares the production database.
#   target=production  → Worker `mmg-law-firm` behind `mmg-law-firm-front`
#                        on www + apex (Cloudflare since the 2026-10-25
#                        cutover, front Worker since Nov 2026). Pushes to main deploy this
#                        target after staging passed. It is the only scheduler: scheduled()
#                        no-ops unless CRON_ENABLED=1, so keep cron_enabled
#                        on (the default) unless you mean to pause the jobs,
#                        e.g. step 1 of the rollback.
#
# Secrets resolve from the matching GitHub environment first
# (`cloudflare-staging` / `cloudflare-production`), then the repository.
# Required: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# NEXT_PUBLIC_* values are inlined at build time, so they go to the build
# step as well as to the Worker.

on:
  # Every merge to main deploys staging, checks it, then deploys production
  # with crons on (the Worker is the only scheduler since the cutover). The
  # production job still waits for the owner's approval on the
  # cloudflare-production environment until the owner removes that click. Runs queue one at a
  # time; if several merges pile up, cancel the older waiting runs and
  # approve the newest, which ships everything merged so far.
  push:
    branches: [main]
    # A push starts a production deploy unless every changed file is skipped
    # below. Patterns are read in order: a later "!" pattern skips what an
    # earlier one matched, a later plain pattern deploys it again. Deny by
    # default: a path is skipped only when the Worker build provably never
    # reads it. scripts/deploy-skip/check.mjs proves that on every pull
    # request (workflow deploy-skip-check.yml); to skip a new path, make the
    # check pass first. workflow_dispatch is not filtered by any of this.
    # deploy-skip:start (scripts/deploy-skip/check.mjs reads this block; a later line wins)
    paths:
      # Everything deploys unless a line below skips it.
      - "**"
      # docs/ is prose for people; the build never reads it.
      - "!docs/**"
      # Markdown outside src and public is prose; the build never reads it.
      - "!**/*.md"
      # Workflows, health probes and issue config run on GitHub, not in the Worker.
      - "!.github/**"
      # scripts/ is run by hand or by workflows; cf:build and the OpenNext build command do not call it.
      - "!scripts/**"
      # tools/ holds design handoff material that nothing in src imports.
      - "!tools/**"
      # supabase/ holds SQL migrations applied by hand; the build never reads them.
      - "!supabase/**"
      # vitest.config.ts is read by vitest only.
      - "!vitest.config.ts"
      # Put back: the deploy workflow itself. Its secrets list, --var values and
      # build env reach the Worker only when a deploy runs, so a change here must deploy.
      - ".github/workflows/cloudflare-deploy.yml"
      # Put back: the one-target workflow it calls, for the same reason.
      - ".github/workflows/cloudflare-deploy-target.yml"
      # Put back: everything under src is shipped (next.config.ts makes .md and
      # .mdx files pages). Tests are skipped again right below.
      - "src/**"
      # Put back: every file under public/ is served as it is, README.md included.
      - "public/**"
      # Tests and their helpers are run by vitest, never imported by the app.
      # A type error in a test shows at the next app deploy (next build checks
      # every .ts file); pnpm typecheck on every row is the guard.
      - "!src/**/*.test.ts"
      - "!src/**/*.test.tsx"
      - "!src/test/**"
    # deploy-skip:end
  workflow_dispatch:
    inputs:
      target:
        description: Which Worker to deploy
        type: choice
        options: [staging, production, rehearse-gate, front-staging, front-production]
        default: staging
        required: true
      cron_enabled:
        description: "production only: run scheduled jobs (leave on; uncheck only to pause them, e.g. for a rollback)"
        type: boolean
        default: true

# The workflow-level group differs from the job-level group inside
# cloudflare-deploy-target.yml (cloudflare-target-*): the same name in both
# makes GitHub cancel the run as a deadlock.
concurrency:
  group: cloudflare-deploy-${{ github.event_name == 'push' && 'pipeline' || inputs.target }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # A push to main deploys staging first and reads it from outside.
  staging:
    if: github.event_name == 'push' || inputs.target == 'staging' || inputs.target == 'rehearse-gate'
    uses: ./.github/workflows/cloudflare-deploy-target.yml
    with:
      target: staging
      # Only the rehearsal makes the staging check fail on purpose.
      fail_check: ${{ inputs.target == 'rehearse-gate' }}
    secrets: inherit

  # Production starts only when `staging` (its deploy and its check) finished
  # green. No always(), !cancelled() or failure() here: a failed or skipped
  # staging job skips this one. The rehearsal flag makes the guard refuse a
  # production deploy, so a rehearsal can never ship even if this wiring broke.
  production:
    needs: staging
    if: github.event_name == 'push' || inputs.target == 'rehearse-gate'
    uses: ./.github/workflows/cloudflare-deploy-target.yml
    with:
      target: production
      cron_enabled: true
      rehearsal: ${{ inputs.target == 'rehearse-gate' }}
    secrets: inherit

  # The way back, not gated: a run by hand with target production, as before.
  production-by-hand:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'production'
    uses: ./.github/workflows/cloudflare-deploy-target.yml
    with:
      target: production
      cron_enabled: ${{ inputs.cron_enabled }}
    secrets: inherit

  # OPS-398: the front Worker alone (the enquiry hold), no app build, no cache
  # loss: the live build id is kept. Staging first by hand; production only
  # from main, and its environment still waits for the owner's approval click.
  front-staging:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'front-staging'
    uses: ./.github/workflows/cloudflare-deploy-target.yml
    with:
      target: staging
      front_only: true
    secrets: inherit

  front-production:
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'front-production' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/cloudflare-deploy-target.yml
    with:
      target: production
      cron_enabled: ${{ inputs.cron_enabled }}
      front_only: true
    secrets: inherit
