name: Monitor deploy

# OPS-59. Deploys the monitor Worker `mmg-law-firm-monitor`: it checks the site
# from outside every 15 minutes with the same checks as the GitHub probe
# (scripts/health/checks.mjs) and serves GET /status. It costs no GitHub minutes
# once it runs, and it keeps answering when the site does not.
#
# Starts on a push to main that changes the monitor or this file, and by hand.
# NO pull request trigger on purpose: this job holds the Cloudflare deploy token,
# and unreviewed code must never run with it. The pull request rehearsal is the
# self-test job of health-monitor.yml, which holds no secret.
#
# The paths below are on the deploy skip list (scripts/, .github/), so this file
# and the monitor never start a deploy of the site.
#
# The job uses the environment cloudflare-production, like the site's deploy, so
# it waits for the same approval click while that click exists.
#
# Alert email is the owner's switch: only when the repository variable
# MONITOR_ALERT_EMAIL is set does the "Alert settings" step give the monitor an
# address and the mail key this repo already holds. Nobody but the owner sets it.
#
# Inbox rows (OPS-352): the monitor files a row in the Crew's Notion Inbox through
# a service binding to the shared intake Worker crew-intake (no secret here), after
# its own 24 hour quiet. REHEARSAL, by hand only: start this workflow with
# "rehearse" true. It then skips the real deploy and runs a throwaway copy of the
# monitor, the Worker mmg-law-firm-monitor-rehearsal (REHEARSAL=1: no request to the
# site, one forced failure, both quiets over, at most one row). It reads that copy's
# /status every 60 seconds for up to 17 minutes until rowAlerts.filed is 1, prints
# "rehearsal: row filed: yes" or "no" and the fixed word rowAlerts.lastResult, and a
# final step that always runs deletes the copy and prints "rehearsal worker deleted".
# The Inbox shows one row ending in [rehearsal]. If a run is cut and the copy is
# left behind: pnpm exec wrangler delete --name mmg-law-firm-monitor-rehearsal --force

on:
  push:
    branches: [main]
    paths:
      - scripts/health/**
      - .github/workflows/monitor-deploy.yml
  workflow_dispatch:
    inputs:
      rehearse:
        description: Rehearsal only. Deploy a throwaway copy that files one Inbox row, then delete it. No real deploy.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: monitor-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: cloudflare-production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Health tests
        run: node --test scripts/health/probe.test.mjs scripts/health/monitor/monitor.test.mjs

      - name: Deploy the monitor
        if: ${{ !inputs.rehearse }}
        run: pnpm exec wrangler deploy --config scripts/health/monitor/wrangler.jsonc

      # Only when the owner has set MONITOR_ALERT_EMAIL. Prints the names only
      # and deletes its file, the way the site's "Worker secrets" step does.
      - name: Alert settings
        if: ${{ !inputs.rehearse && vars.MONITOR_ALERT_EMAIL != '' }}
        run: |
          node -e '
            const names = ["ALERT_EMAIL","RESEND_API_KEY","RESEND_FROM_EMAIL"];
            const out = {};
            for (const n of names) if (process.env["S_" + n]) out[n] = process.env["S_" + n];
            require("fs").writeFileSync("monitor-secrets.json", JSON.stringify(out));
            console.log("setting:", Object.keys(out).join(", ") || "(none)");
          '
          pnpm exec wrangler secret bulk monitor-secrets.json --config scripts/health/monitor/wrangler.jsonc
          rm -f monitor-secrets.json
        env:
          S_ALERT_EMAIL: ${{ vars.MONITOR_ALERT_EMAIL }}
          S_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          S_RESEND_FROM_EMAIL: ${{ secrets.RESEND_FROM_EMAIL }}

      - name: Status address
        if: ${{ !inputs.rehearse }}
        run: |
          sub=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result.subdomain||"")}catch{console.log("")}})')
          echo "status address: ${sub:+https://mmg-law-firm-monitor.$sub.workers.dev/status}"

      # Rehearsal (by hand, rehearse true). The copy has the same code and the same
      # CREW_INTAKE binding, REHEARSAL=1 and no secret. Its first cron round (within
      # 15 minutes) files one row; the loop waits for it.
      - name: Rehearsal, deploy the copy and wait for its row
        if: ${{ inputs.rehearse }}
        run: |
          pnpm exec wrangler deploy --config scripts/health/monitor/wrangler.jsonc --name mmg-law-firm-monitor-rehearsal --var REHEARSAL:1
          sub=$(curl -s "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | node -e 'let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{console.log(JSON.parse(d).result.subdomain||"")}catch{console.log("")}})')
          if [ -z "$sub" ]; then echo "rehearsal: no workers.dev address"; echo "rehearsal: row filed: no"; exit 1; fi
          url="https://mmg-law-firm-monitor-rehearsal.$sub.workers.dev/status"
          echo "rehearsal address: $url"
          read_field='let d="";process.stdin.on("data",c=>d+=c).on("end",()=>{try{const r=JSON.parse(d).rowAlerts||{};console.log(process.argv[1]==="filed"?(r.filed>=1?"1":"0"):String(r.lastResult||"none"))}catch{console.log(process.argv[1]==="filed"?"0":"none")}})'
          filed=0
          for i in $(seq 1 17); do
            body=$(curl -s -m 20 "$url" || true)
            filed=$(printf '%s' "$body" | node -e "$read_field" filed)
            [ "$filed" = "1" ] && break
            sleep 60
          done
          last=$(printf '%s' "$body" | node -e "$read_field" last)
          if [ "$filed" = "1" ]; then echo "rehearsal: row filed: yes"; else echo "rehearsal: row filed: no"; fi
          echo "rehearsal: lastResult: $last"
          [ "$filed" = "1" ]

      - name: Rehearsal, delete the copy
        if: ${{ always() && inputs.rehearse }}
        run: |
          if pnpm exec wrangler delete --name mmg-law-firm-monitor-rehearsal --force; then
            echo "rehearsal worker deleted"
          else
            echo "rehearsal worker NOT deleted (it may never have been deployed). If it exists: pnpm exec wrangler delete --name mmg-law-firm-monitor-rehearsal --force"
            exit 1
          fi
