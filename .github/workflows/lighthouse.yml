name: Lighthouse

# Runs Lighthouse against the production build for BOTH mobile and desktop.
# Triggered on PRs to main and on demand. Results are uploaded to temporary
# public storage (a link appears in the job log) and as build artifacts.
#
# For representative scores, set these repository secrets so the public pages
# build with real data + image host (without them the run still works, but
# Supabase-hosted images won't load and data falls back to in-code seeds):
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY
#
# Budgets are "warn" (informational) so a flaky run never blocks a PR; tighten
# to "error" in the .lighthouserc.*.json files once scores are stable.

on:
  workflow_dispatch:
    inputs:
      target:
        description: Local build checks or bounded live car-page diagnostics
        type: choice
        default: local
        options:
          - local
          - live-car-diagnostics
          - directory-comparison
          - applied-throttling
          - toast-comparison
  pull_request:
    branches: [main]

jobs:
  lighthouse:
    if: github.event_name != 'workflow_dispatch' || inputs.target == 'local'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        formfactor: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Lighthouse (${{ matrix.formfactor }})
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./.lighthouserc.${{ matrix.formfactor }}.json
          uploadArtifacts: true
          temporaryPublicStorage: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

  live-car-diagnostics:
    if: github.event_name == 'workflow_dispatch' && inputs.target != 'local'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Install pinned public-page diagnostic tool
        run: npm install --global lighthouse@13.5.0
      - name: Test diagnostic safeguards
        run: node --test tools/performance/live-diagnostic.test.mjs
      - name: Test paired toast diagnostic safeguards
        run: node --test tools/performance/toast-comparison.test.mjs
      - name: Compare nine isolated, unauthenticated mobile loads
        if: inputs.target == 'live-car-diagnostics'
        run: node tools/performance/live-diagnostic.mjs
      - name: Compare fixed baseline and candidate previews without blocking services
        if: inputs.target == 'directory-comparison'
        run: node tools/performance/directory-comparison.mjs
      - name: Measure nine public mobile loads with applied throttling and all services
        if: inputs.target == 'applied-throttling'
        run: node tools/performance/applied-throttling.mjs
      - name: Compare fixed toast previews with applied throttling and all services
        if: inputs.target == 'toast-comparison'
        run: node tools/performance/toast-comparison.mjs
      - name: Retain every result, including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mmg-live-car-diagnostics
          path: |
            outputs/live-car-diagnostics/
            outputs/directory-comparison/
            outputs/applied-throttling/
            outputs/toast-comparison-131/
          retention-days: 7
