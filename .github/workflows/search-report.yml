name: Search results report

# OPS-37. What Google shows people for mmg-lawfirm.com, from the Search Console
# API: clicks, impressions, click rate and average position for the last 28
# days against the 28 before, the top pages, the pages seen but not clicked,
# and (only when the owner allows it, see below) the top searches, the biggest
# movers and the searches at position 5 to 20. Copied from AlwayzLegit/weedtip
# .github/workflows/search-report.yml at df9fdbe (OPS-24) and changed for this
# repository. See scripts/search-report/report.mjs and docs/search-report.md.
#
# What it never prints or stores: the key, a token, the service account
# address, or a person's data. This repository is PUBLIC, so every job
# summary, log line and stored artifact can be read by anyone, for good. Search
# terms can hold a person's name (the other driver, an insurer, a case) and no
# filter can find a name for certain. So search terms are printed and stored
# only when SHOW_SEARCH_TERMS is "true", and that is worked out in the step
# "Decide whether search terms may be shown": true only when the repository is
# private, or when SHOW_TERMS_ON_PUBLIC below is changed to "true". That line
# is "false" in this build. It is changed only on the owner's answer in OPS-25
# (a client matter). If the API call that reads the repository fails, the
# answer is "false".
#
# Not configured: until the secret GSC_SERVICE_ACCOUNT_JSON exists, the run is
# green and prints one line, "Search results report: not configured". That is
# not proof that the report works. The owner step is OPS-25.
#
# One alarm fails the run red: "ALARM impressions" (the 2 newest final days are
# both below 30 percent of their weekday baseline, baseline at least 100 a
# day). Search Console's final data is about 2 days behind, so no run can say
# "today". Runs Monday, Wednesday and Friday at 15:37 UTC (07:37 Pacific
# standard time, 08:37 in summer); the full report on Mondays and manual runs,
# the alarm check on every run. Everything else is a finding.
#
# This workflow starts no production deploy: .github/** and scripts/** are on
# the skip list of cloudflare-deploy.yml (OPS-33), and docs/** and *.md too.
#
# Cost: this repository is public, so GitHub bills 0 minutes for standard
# runners. No pnpm install, no dependency. If the repository is ever made
# private, 3 runs a week of about 1 minute each is about 13 minutes a month.
#
# To silence it at once: GitHub, Actions, Search results report, Disable
# workflow.
#
# Secrets: GSC_SERVICE_ACCOUNT_JSON is set in the env of the one step that
# calls Google, read-only scope, never printed. Every step after the unit
# tests is skipped for a pull request, so the key can never be in a pull
# request run.
on:
  schedule:
    - cron: "37 15 * * 1,3,5" # Mon, Wed, Fri 07:37 PST
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/search-report/**"
      - ".github/workflows/search-report.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: search-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      # Changed to "true" only on the owner's answer in OPS-25. See the header.
      SHOW_TERMS_ON_PUBLIC: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Unit tests
        run: node --test scripts/search-report/report.test.mjs

      - name: Fetch the last report
        if: github.event_name != 'pull_request'
        run: |
          # Latest successful run of this workflow on main; quiet when there is none.
          id=$(gh api "repos/${{ github.repository }}/actions/workflows/search-report.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty' 2>/dev/null || true)
          if [ -n "$id" ]; then
            gh run download "$id" --repo "${{ github.repository }}" -n search-report-latest -D previous >/dev/null 2>&1 || echo "No search-report-latest artifact in run ${id}"
          else
            echo "No earlier search-report run"
          fi

      - name: Decide whether search terms may be shown
        if: github.event_name != 'pull_request'
        id: terms
        run: |
          show=false
          if [ "$SHOW_TERMS_ON_PUBLIC" = "true" ]; then
            show=true
          elif [ "$(gh api "repos/${{ github.repository }}" --jq .private 2>/dev/null || true)" = "true" ]; then
            show=true
          fi
          echo "show=$show" >> "$GITHUB_OUTPUT"
          echo "Search terms shown: $show"

      - name: Search results report
        if: github.event_name != 'pull_request'
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_DOMAIN: mmg-lawfirm.com
          GSC_SITE_URL: ${{ vars.GSC_SITE_URL }}
          SHOW_SEARCH_TERMS: ${{ steps.terms.outputs.show }}
        run: |
          args=(--out search-report.json)
          # The full report on Mondays and on any manual run.
          if [ "${{ github.event_name }}" != "schedule" ] || [ "$(date -u +%u)" = "1" ]; then
            args+=(--report)
          fi
          if [ -f previous/search-report.json ]; then args+=(--previous previous/search-report.json); fi
          node scripts/search-report/report.mjs "${args[@]}"

      - name: Keep the numbers for next time
        if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && hashFiles('search-report.json') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: search-report-latest
          path: search-report.json
          retention-days: 90
